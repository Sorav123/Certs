name: AppleJr Sync

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, zip, openssl, dom, libxml
          coverage: none

      - name: Run AppleJr sync
        run: php applejr_sync.php
        env:
          # GitHub's built-in token, auto-provided — no secret needed.
          # It has contents:write on this repo via the workflow permission above.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit state (persist across runs)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add applejr_sync_state.json discovered_passwords.txt
          if git diff --cached --quiet; then
            echo "No state changes"
          else
            git commit -m "Update sync state — $(date -u +%Y-%m-%d\ %H:%M)"
            git pull --rebase origin main
            git push
          fi
